dataset: strict_text_min8
evaluation: paired_all_genes
method: full_scgates
seed: 42
training:
  epochs: 40
  batch_size: 32
  lr: 0.0001
  hidden_dim: 256
  align_dim: 256
  dropout: 0.1
  max_instances: 128
  max_text_evidence: 96
text:
  conf_mode: text_only
  conf_gate_mode: prior_sigmoid
  conf_gate_scale: 2.0
  evidence_sampling: prior_diverse
  diversity_weight: 0.7
stage1:
  instance_score_alpha: 0.3
  instance_score_mode: signed
noise:
  text_noise_kind: easy_random_text
  text_noise_ratio: 1.0
  text_noise_max: 64
  text_noise_splits: both
  text_noise_prior_mode: uniform


